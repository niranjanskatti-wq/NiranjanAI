name: GoldVault APK

on:
  push:
    paths:
      - 'goldvault/**'
      - '.github/workflows/goldvault-apk.yml'
  pull_request:
    paths:
      - 'goldvault/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK as a direct download (GitHub Release)
    defaults:
      run:
        working-directory: goldvault
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests (run fully offline, incl. airplane-mode test)
        run: flutter test

      # Optional: real release signing. Add repository secrets
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD. Without them the APK is signed with a debug key.
      - name: Release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/goldvault.jks
          cat > android/key.properties <<PROPS
          storeFile=goldvault.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # Permanent GoldVault key: every build is signed with the same key, so a
      # new APK installs as an update over the old one (data is kept). The key
      # file is stored encrypted in the repo; only the GOLDVAULT_SIGNING_PASSWORD
      # repository secret can unlock it.
      - name: Permanent signing key
        env:
          GOLDVAULT_SIGNING_PASSWORD: ${{ secrets.GOLDVAULT_SIGNING_PASSWORD }}
        if: env.GOLDVAULT_SIGNING_PASSWORD != '' && hashFiles('goldvault/android/key.properties') == ''
        run: |
          umask 077
          printf '%s' "$GOLDVAULT_SIGNING_PASSWORD" > "$RUNNER_TEMP/gvpass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in android/app/goldvault-release.jks.enc -out android/app/goldvault.jks \
            -pass "file:$RUNNER_TEMP/gvpass"
          rm -f "$RUNNER_TEMP/gvpass"
          cat > android/key.properties <<PROPS
          storeFile=goldvault.jks
          storePassword=$GOLDVAULT_SIGNING_PASSWORD
          keyAlias=goldvault
          keyPassword=$GOLDVAULT_SIGNING_PASSWORD
          PROPS
          echo "Signed with the permanent GoldVault key: updates install over the old app." >> "$GITHUB_STEP_SUMMARY"

      - name: Signing warning
        if: hashFiles('goldvault/android/key.properties') == ''
        run: echo "::warning::No permanent signing key - this APK will NOT install over an older one. Add the GOLDVAULT_SIGNING_PASSWORD secret."

      # One small APK per phone type instead of one big "universal" APK.
      # arm64 = almost every phone from the last ~8 years; armv7 = very old phones.
      # (x86_64 is only for emulators, so it is left out.)
      - name: Build APKs
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate --split-debug-info=build/symbols \
            --build-number=${{ github.run_number }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk GoldVault-arm64.apk
          mv app-armeabi-v7a-release.apk GoldVault-armv7-old-phones.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoldVault-arm64 (most phones)
          path: goldvault/build/app/outputs/flutter-apk/GoldVault-arm64.apk
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: GoldVault-armv7 (very old phones)
          path: goldvault/build/app/outputs/flutter-apk/GoldVault-armv7-old-phones.apk
          compression-level: 0
          if-no-files-found: error

      # Direct .apk download (no zip, no GitHub login needed), always at:
      #   https://github.com/<owner>/<repo>/releases/latest/download/GoldVault.apk
      - name: Publish direct download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          cp GoldVault-arm64.apk GoldVault.apk
          cp GoldVault-armv7-old-phones.apk GoldVault-old-phones.apk
          TAG="goldvault-build-${{ github.run_number }}"
          gh release create "$TAG" GoldVault.apk GoldVault-old-phones.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "GoldVault (build ${{ github.run_number }})" \
            --notes "Tap **GoldVault.apk** to download and install on your phone (most phones). Use GoldVault-old-phones.apk only if that one does not install." \
            --latest
