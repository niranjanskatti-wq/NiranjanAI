# Builds the Smriti Android app and publishes the APK as a GitHub release,
# so it can be downloaded straight onto the phone.
name: Smriti Android build

on:
  push:
    paths:
      - "smriti/**"
      - ".github/workflows/smriti-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smriti-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smriti
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --exclude-tags screenshots

      # One signing key for every build, so each new APK installs as an update
      # over the last one and keeps the app's data. It lives in the Actions cache
      # (private to this repository, never in the code). The two secrets, if
      # ever added, take priority.
      - name: Restore the build signing key
        id: buildkey
        uses: actions/cache@v4
        with:
          path: smriti/android/app/smriti-build.jks
          key: smriti-build-signing-key-v1

      - name: Create the build signing key (first build only)
        if: steps.buildkey.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore android/app/smriti-build.jks -alias smriti \
            -storepass smriti-build -keypass smriti-build -keyalg RSA -keysize 2048 \
            -validity 36500 -dname "CN=Smriti, O=Personal"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SMRITI_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SMRITI_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/smriti.jks
            printf "storeFile=smriti.jks\nstorePassword=%s\nkeyAlias=smriti\nkeyPassword=%s\n" \
              "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
            echo "SIGNING=your private key" >> "$GITHUB_ENV"
          else
            printf "storeFile=smriti-build.jks\nstorePassword=smriti-build\nkeyAlias=smriti\nkeyPassword=smriti-build\n" \
              > android/key.properties
            echo "SIGNING=the saved build key (installs as an update over earlier builds signed the same way)" >> "$GITHUB_ENV"
          fi
          keytool -list -v -keystore android/app/$(grep storeFile android/key.properties | cut -d= -f2) \
            -storepass "$(grep storePassword android/key.properties | cut -d= -f2)" | grep -m1 "SHA256:" || true

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "../Smriti-build-${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smriti-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Smriti · build ${{ github.run_number }}
          prerelease: true
          files: Smriti-build-${{ github.run_number }}.apk
          body: |
            Smriti Android app, build ${{ github.run_number }} (branch `${{ github.ref_name }}`).

            **To install:** open this page on your Android phone, tap the `.apk` file under Assets,
            then open the download and allow "Install unknown apps" for your browser when asked.

            Signed with ${{ env.SIGNING }}.
