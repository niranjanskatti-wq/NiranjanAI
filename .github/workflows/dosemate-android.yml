name: DoseMate Android

on:
  push:
    paths:
      - "dosemate/**"
      - ".github/workflows/dosemate-android.yml"
  pull_request:
    paths:
      - "dosemate/**"
      - ".github/workflows/dosemate-android.yml"
  workflow_dispatch:

concurrency:
  group: dosemate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dosemate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (scheduling engine + app)
        run: ./gradlew --no-daemon --stacktrace :core:scheduling:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK (unsigned unless signing secrets are configured)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            dosemate/core/scheduling/build/reports/tests
            dosemate/app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dosemate-apks
          path: dosemate/app/build/outputs/apk/**/*.apk
