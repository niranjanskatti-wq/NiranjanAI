name: DoseMate Android

on:
  push:
    paths:
      - "dosemate/**"
      - ".github/workflows/dosemate-android.yml"
  pull_request:
    paths:
      - "dosemate/**"
      - ".github/workflows/dosemate-android.yml"
  workflow_dispatch:

concurrency:
  group: dosemate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dosemate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (scheduling engine + app)
        run: ./gradlew --no-daemon :core:scheduling:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK (unsigned unless signing secrets are configured)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            dosemate/core/scheduling/build/reports/tests
            dosemate/app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dosemate-apks
          path: dosemate/app/build/outputs/apk/**/*.apk

      - name: Publish latest APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DoseMate.apk
          gh release delete dosemate-latest --yes --cleanup-tag || true
          gh release create dosemate-latest DoseMate.apk \
            --target "${{ github.sha }}" \
            --title "DoseMate (latest build)" \
            --notes "Latest DoseMate build from ${{ github.ref_name }} (${{ github.sha }}). Download DoseMate.apk and open it on your phone to install." \
            --prerelease
