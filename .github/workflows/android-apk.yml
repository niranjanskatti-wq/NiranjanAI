name: Build SwarnaCalc Android APK

on:
  push:
    paths:
      - "public/swarnacalc/**"
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: gradle --no-daemon -p android assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SwarnaCalc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SwarnaCalc-apk
          path: SwarnaCalc.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swarnacalc-v1.0.${{ github.run_number }}
          name: SwarnaCalc 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: SwarnaCalc.apk
          body: |
            **Download:** SwarnaCalc.apk below → open it on your Android phone → allow "Install unknown apps" if asked.

            Offline gold & jewellery price calculator. Installing a newer APK over an older one keeps all your saved estimates and settings.
