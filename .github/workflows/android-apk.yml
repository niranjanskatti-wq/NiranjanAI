# Builds the SwarnaCalc Android app and publishes the APK as a GitHub release,
# so it can be downloaded straight onto the phone.
name: SwarnaCalc Android build

on:
  push:
    paths:
      - "public/swarnacalc/**"
      - "swarnacalc-android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swarnacalc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run calculation tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # One signing key for every build, so each new APK installs as an update
      # over the last one and keeps the app's data. It lives in the Actions
      # cache (private to this repository, never in the code).
      - name: Restore the build signing key
        id: buildkey
        uses: actions/cache@v4
        with:
          path: swarnacalc-android/app/swarnacalc-build.jks
          key: swarnacalc-build-signing-key-v1

      - name: Create the build signing key (first build only)
        if: steps.buildkey.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore swarnacalc-android/app/swarnacalc-build.jks -alias swarnacalc \
            -storepass swarnacalc-build -keypass swarnacalc-build -keyalg RSA -keysize 2048 \
            -validity 36500 -dname "CN=SwarnaCalc, O=Personal"

      - name: Build APK
        run: gradle --no-daemon -p swarnacalc-android assembleRelease

      - name: Name the APK
        run: cp swarnacalc-android/app/build/outputs/apk/release/app-release.apk "SwarnaCalc-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SwarnaCalc-apk
          path: SwarnaCalc-build-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swarnacalc-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SwarnaCalc · build ${{ github.run_number }}
          prerelease: true
          files: SwarnaCalc-build-${{ github.run_number }}.apk
          body: |
            SwarnaCalc – Gold & Jewellery Price Calculator, Android build ${{ github.run_number }} (branch `${{ github.ref_name }}`).

            **To install:** open this page on your Android phone, tap the `.apk` file under Assets,
            then open the download and allow "Install unknown apps" for your browser when asked.
            Works fully offline. Newer builds install over older ones and keep your saved estimates.
